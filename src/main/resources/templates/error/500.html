<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error del servidor</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232e86de'%3E%3Cpath d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z'/%3E%3C/svg%3E">
</head>
<body>
<div class="layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <div class="main">
        <div th:replace="~{fragments/topbar :: topbar}"></div>
        <div class="page-body">
            <div class="error-container">
                <div class="error-code">500</div>
                <h2>Error interno del servidor</h2>
                <p>Algo salió mal. Por favor, intenta de nuevo o contacta al administrador.</p>
                <p th:if="${errorMsg}" style="color: var(--danger); font-weight:600;">[[${errorMsg}]]</p>
                <a th:href="@{/dashboard}" class="btn btn-primary">Ir al Dashboard</a>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
