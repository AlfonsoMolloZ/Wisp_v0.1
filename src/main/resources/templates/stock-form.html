<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisp — Stock</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
  <th:block th:replace="~{fragments/theme :: theme-init}"></th:block>
</head>

<body>

  <div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

      <!-- Topbar -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <div class="page-body">

        <div class="page-header">
          <h1 th:text="${stock.id == null} ? 'Nuevo equipo' : 'Editar equipo'">Nuevo equipo</h1>
          <a href="/stock" class="btn btn-outline">
            <span class="ph ph-arrow-left" style="font-size:18px;"></span>
            Volver
          </a>
        </div>

        <div class="table-wrap" style="padding: 28px;">

          <form th:action="@{/stock/guardar}" th:object="${stock}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Equipo</label>
                <select th:field="*{equipo}">
                  <option value="Router">Router</option>
                  <option value="Antena">Antena</option>
                  <option value="Switch">Switch</option>
                  <option value="Cable">Cable</option>
                  <option value="Otro">Otro</option>
                </select>
              </div>

              <div class="form-group">
                <label>Marca</label>
                <input type="text" th:field="*{marca}" placeholder="TP-Link, Ubiquiti..." required />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Modelo</label>
                <input type="text" th:field="*{modelo}" placeholder="TL-MR6400" required />
              </div>

              <div class="form-group">
                <label>Cantidad</label>
                <input type="number" th:field="*{cantidad}" min="0" required />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Estado</label>
                <select th:field="*{estado}">
                  <option value="Nuevo">Nuevo</option>
                  <option value="Usado">Usado</option>
                </select>
              </div>

              <div class="form-group">
                <label>Último ingreso</label>
                <input type="date" th:field="*{ultimoIngreso}" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
              <span class="ph ph-floppy-disk" style="font-size:18px;"></span>
              Guardar
            </button>
          </form>

        </div>

      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script th:src="@{/js/main.js}"></script>

</body>
</html>
