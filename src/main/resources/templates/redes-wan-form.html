<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WispJR — Red WAN</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
  <th:block th:replace="~{fragments/theme :: theme-init}"></th:block>
</head>

<body>

  <div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

      <!-- Topbar -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <div class="page-body">

        <div class="page-header">
          <h1 th:text="${red.id == null} ? 'Nueva Red WAN' : 'Editar Red WAN'">Nueva Red WAN</h1>
          <a href="/redes-wan" class="btn btn-outline">
            <span class="ph ph-arrow-left" style="font-size:18px;"></span>
            Volver
          </a>
        </div>

        <div class="table-wrap" style="padding: 28px;">

          <form th:action="@{/redes-wan/guardar}" th:object="${red}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
              <label>Nombre de la red</label>
              <input type="text" th:field="*{nombre}" placeholder="Red Principal" required />
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Dirección de red</label>
                <input type="text" th:field="*{direccionRed}" placeholder="192.168.10.0" required />
              </div>

              <div class="form-group">
                <label>Máscara de subred</label>
                <input type="text" th:field="*{mascara}" placeholder="255.255.255.0" required />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Gateway</label>
                <input type="text" th:field="*{gateway}" placeholder="192.168.10.1" required />
              </div>

              <div class="form-group">
                <label>DNS</label>
                <input type="text" th:field="*{dns}" placeholder="8.8.8.8" />
              </div>
            </div>

            <div class="form-group" style="max-width: 480px;">
              <label>Estado</label>
              <select th:field="*{estado}">
                <option value="Activa">Activa</option>
                <option value="Inactiva">Inactiva</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
              <span class="ph ph-floppy-disk" style="font-size:18px;"></span>
              Guardar
            </button>
          </form>

        </div>

      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script th:src="@{/js/main.js}"></script>

</body>
</html>
