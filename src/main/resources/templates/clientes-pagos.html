<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WispJR — Pagos del Cliente</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <th:block th:replace="~{fragments/favicon :: favicon}"></div>
  <style>
    .cliente-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 24px;
      margin-bottom: 24px;
      animation: fadeInUp var(--duration-normal) var(--ease-smooth);
    }
    .cliente-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(42, 46, 66, 0.5);
    }
    .cliente-row:last-child { border-bottom: none; }
    .cliente-label {
      font-weight: 600;
      color: var(--text-secondary);
      font-size: 13px;
    }
    .cliente-value {
      color: var(--text);
      font-size: 14px;
    }
  </style>
  <th:block th:replace="~{fragments/theme :: theme-init}"></th:block>
</head>

<body>

  <div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

      <!-- Topbar -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <div class="page-body">

        <div class="page-header">
          <h1>Historial de pagos</h1>
          <a href="/clientes" class="btn btn-outline">
            <span class="ph ph-arrow-left" style="font-size:18px;"></span>
            Volver
          </a>
        </div>

        <div class="cliente-card">
          <div class="cliente-row">
            <span class="cliente-label">Cliente</span>
            <span class="cliente-value" th:text="${cliente.nombre}"></span>
          </div>
          <div class="cliente-row">
            <span class="cliente-label">Plan</span>
            <span class="cliente-value" th:text="${cliente.plan != null ? cliente.plan.nombre : 'Sin plan'}"></span>
          </div>
          <div class="cliente-row">
            <span class="cliente-label">Estado</span>
            <span class="badge"
              th:classappend="${cliente.estado == 'Activo'} ? 'badge-active' : 'badge-suspend'"
              th:text="${cliente.estado}"></span>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Mes</th>
                <th>Año</th>
                <th>Monto</th>
                <th>Estado</th>
                <th>Fecha Pago</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="pago : ${pagos}">
                <td th:text="${pago.mes}"></td>
                <td th:text="${pago.anio}"></td>
                <td th:text="${'S/ ' + pago.monto}"></td>
                <td>
                  <span class="badge"
                    th:classappend="${pago.estado == 'Pagado'} ? 'badge-active' : 'badge-suspend'"
                    th:text="${pago.estado}"></span>
                </td>
                <td th:text="${pago.fechaPago != null ? #temporals.format(pago.fechaPago,'dd/MM/yyyy') : '-'}"></td>
              </tr>
              <tr th:if="${#lists.isEmpty(pagos)}">
                <td colspan="5">
                  <div class="empty-state">
                    <span class="empty-icon ph ph-currency-dollar"></span>
                    <h3>No hay pagos</h3>
                    <p>Este cliente no tiene pagos registrados</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script th:src="@{/js/main.js}"></script>

</body>
</html>
