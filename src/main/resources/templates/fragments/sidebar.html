<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>
  <!-- Overlay para móvil -->
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <aside th:fragment="sidebar" class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <img th:src="@{/img/logo.png}" alt="Wisp" class="logo-img" />
      <span>Wisp</span>
    </div>
    <nav>
      <a sec:authorize="hasRole('ADMIN')" href="/redes-wan" class="nav-item" data-tooltip="Redes WAN">
        <span class="icon ph ph-network"></span>
        <span class="nav-label">Redes WAN</span>
      </a>
      <a sec:authorize="hasRole('ADMIN')" href="/clientes" class="nav-item" data-tooltip="Clientes">
        <span class="icon ph ph-users"></span>
        <span class="nav-label">Clientes</span>
      </a>
      <a sec:authorize="hasAnyRole('ADMIN','Tecnico')" href="/instalaciones" class="nav-item" data-tooltip="Instalaciones">
        <span class="icon ph ph-wrench"></span>
        <span class="nav-label">Instalaciones</span>
      </a>
      <a sec:authorize="hasAnyRole('ADMIN','Tecnico')" href="/averias" class="nav-item" data-tooltip="Averías">
        <span class="icon ph ph-bug"></span>
        <span class="nav-label">Averías</span>
      </a>
      <a sec:authorize="hasRole('ADMIN')" href="/pagos" class="nav-item" data-tooltip="Pagos">
        <span class="icon ph ph-currency-dollar"></span>
        <span class="nav-label">Pagos</span>
      </a>
      <a sec:authorize="hasRole('ADMIN')" href="/dashboard" class="nav-item" data-tooltip="Dashboard">
        <span class="icon ph ph-chart-pie-slice"></span>
        <span class="nav-label">Dashboard</span>
      </a>
      <a sec:authorize="hasRole('ADMIN')" href="/stock" class="nav-item" data-tooltip="Stock">
        <span class="icon ph ph-package"></span>
        <span class="nav-label">Stock</span>
      </a>
      <a sec:authorize="hasRole('ADMIN')" href="/usuarios" class="nav-item" data-tooltip="Usuarios">
        <span class="icon ph ph-user"></span>
        <span class="nav-label">Usuarios</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <form th:action="@{/logout}" method="post">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <button type="submit" class="logout-btn">
          <span class="icon ph ph-sign-out"></span>
          <span class="logout-label">Cerrar sesión</span>
        </button>
      </form>
    </div>
  </aside>
</body>
</html>
