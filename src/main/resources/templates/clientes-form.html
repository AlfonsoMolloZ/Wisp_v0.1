<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisp — Cliente</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
  <th:block th:replace="~{fragments/theme :: theme-init}"></th:block>
</head>

<body>
  <div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

      <!-- Topbar -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <div class="page-body">

        <div class="page-header">
          <h1 th:text="${cliente.id == null} ? 'Nuevo cliente' : 'Editar cliente'">Nuevo cliente</h1>
          <a href="/clientes" class="btn btn-outline">
            <span class="ph ph-arrow-left" style="font-size:18px;"></span>
            Volver
          </a>
        </div>

        <div class="table-wrap" style="padding: 28px;">
          <form th:action="@{/clientes/guardar}" th:object="${cliente}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Nombres <button type="button" class="help-icon" data-help="cliente.identidad" aria-label="Ayuda"></button></label>
                <input type="text" th:field="*{nombres}" placeholder="Ingrese nombres" required />
              </div>

              <div class="form-group">
                <label>Apellidos</label>
                <input type="text" th:field="*{apellidos}" placeholder="Ingrese apellidos" required />
              </div>

              <div class="form-group">
                <label>DNI</label>
                <input type="text" th:field="*{dni}" placeholder="Ingrese DNI" required />
              </div>

              <div class="form-group">
                <label>Teléfono</label>
                <input type="text" th:field="*{telefono}" placeholder="Ingrese teléfono" />
              </div>

              <div class="form-group">
                <label>Dirección</label>
                <input type="text" th:field="*{direccion}" placeholder="Ingrese dirección" />
              </div>

              <div class="form-group">
                <label>Correo</label>
                <input type="email" th:field="*{correo}" placeholder="correo@ejemplo.com" />
              </div>

              <div class="form-group">
                <label>Red WAN <button type="button" class="help-icon" data-help="cliente.redWan" aria-label="Ayuda"></button></label>
                <select th:field="*{redWanId}" required>
                  <option value="">-- Seleccione una red --</option>
                  <option th:each="red : ${redes}" th:value="${red.id}" th:text="${red.nombre}"></option>
                </select>
              </div>

              <div class="form-group">
                <label>Plan <button type="button" class="help-icon" data-help="cliente.plan" aria-label="Ayuda"></button></label>
                <select th:field="*{planId}">
                  <option th:each="plan : ${planes}" th:value="${plan.id}" th:text="${plan.nombre}"></option>
                </select>
              </div>
            </div>

            <!-- Estado -->
            <div th:if="${cliente.estado == 'Suspendido'}" class="form-group" style="max-width: 480px;">
              <label>Estado <button type="button" class="help-icon" data-help="cliente.estado" aria-label="Ayuda"></button></label>
              <select th:field="*{estado}">
                <option value="Suspendido">Suspendido</option>
                <option value="Activo">Activar</option>
              </select>
            </div>
            <div class="form-group" th:unless="${cliente.estado == 'Suspendido'}" style="max-width: 480px;">
              <label>Estado <button type="button" class="help-icon" data-help="cliente.estado" aria-label="Ayuda"></button></label>
              <input type="text" th:value="${cliente.estado}" readonly style="opacity: 0.6; cursor: not-allowed;" />
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
              <span class="ph ph-floppy-disk" style="font-size:18px;"></span>
              Guardar
            </button>
            <button type="button" class="help-icon" data-help="cliente.guardar" aria-label="Ayuda"></button>
          </form>

          <div th:if="${error}" class="alert-error" style="margin-top:16px; max-width: 480px;">
            <p th:text="${error}"></p>
          </div>

        </div>

      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script th:src="@{/js/main.js}"></script>

</body>
</html>
