<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wisp — Plan</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
  <th:block th:replace="~{fragments/theme :: theme-init}"></th:block>
</head>

<body>

  <div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

      <!-- Topbar -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <div class="page-body">

        <div class="page-header">
          <h1 th:text="${plan.id == null} ? 'Nuevo Plan' : 'Editar Plan'">Nuevo Plan</h1>
          <a href="/planes" class="btn btn-outline">
            <span class="ph ph-arrow-left" style="font-size:18px;"></span>
            Volver
          </a>
        </div>

        <div class="table-wrap" style="padding: 28px;">

          <form th:action="@{/planes/guardar}" th:object="${plan}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
              <label>Nombre del plan</label>
              <input type="text" th:field="*{nombre}" placeholder="Básico" required />
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Precio</label>
                <input type="number" th:field="*{precio}" placeholder="10.00" step="0.01" min="0" required />
              </div>

              <div class="form-group">
                <label>Velocidad (Mbps)</label>
                <input type="number" th:field="*{velocidad}" placeholder="10" min="1" required />
              </div>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
              <span class="ph ph-floppy-disk" style="font-size:18px;"></span>
              Guardar
            </button>
          </form>

        </div>

      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script th:src="@{/js/main.js}"></script>

</body>
</html>
