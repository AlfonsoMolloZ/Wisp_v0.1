<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WispJR — Avería</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
  <th:block th:replace="~{fragments/theme :: theme-init}"></th:block>
</head>

<body>

  <div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

      <!-- Topbar -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <div class="page-body">

        <div class="page-header">
          <h1 th:text="${averia.id == null} ? 'Nueva avería' : 'Editar avería'">Nueva avería</h1>
          <a href="/averias" class="btn btn-outline">
            <span class="ph ph-arrow-left" style="font-size:18px;"></span>
            Volver
          </a>
        </div>

        <div class="table-wrap" style="padding: 28px;">

          <form th:action="@{/averias/guardar}" th:object="${averia}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
              <label>Cliente</label>
              <div th:if="${averia.id == null}">
                <select th:field="*{clienteId}" required>
                  <option value="">-- Seleccionar cliente --</option>
                  <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nombre}"></option>
                </select>
              </div>
              <div th:if="${averia.id != null}">
                <input type="text" th:value="${averia.nombreCliente != null ? averia.nombreCliente : 'Sin cliente'}" readonly />
                <input type="hidden" th:field="*{clienteId}" />
              </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0 24px;">
              <div class="form-group">
                <label>Código</label>
                <input type="text" th:field="*{codigo}" placeholder="A12123" required />
              </div>

              <div class="form-group">
                <label>Dirección</label>
                <input type="text" th:field="*{direccion}" placeholder="Mz J lote 3" required />
              </div>
            </div>

            <div class="form-group">
              <label>Descripción</label>
              <input type="text" th:field="*{descripcion}" placeholder="Describe el problema..." />
            </div>

            <div class="form-group" style="max-width: 480px;">
              <label>Estado</label>
              <select th:field="*{estado}">
                <option value="Sin atender">Sin atender</option>
                <option value="Atendido">Atendido</option>
              </select>
            </div>

            <button type="submit" class="btn btn-primary" style="margin-top: 8px;">
              <span class="ph ph-floppy-disk" style="font-size:18px;"></span>
              Guardar
            </button>
          </form>

        </div>

      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script th:src="@{/js/main.js}"></script>

</body>
</html>
