<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clientes</title>
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  <th:block th:replace="~{fragments/favicon :: favicon}"></th:block>
  <th:block th:replace="~{fragments/theme :: theme-init}"></th:block>
</head>

<body>

  <div class="layout">

    <!-- Sidebar -->
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="main">

      <!-- Topbar -->
      <div th:replace="~{fragments/topbar :: topbar}"></div>

      <div class="page-body">

        <div class="page-header">
          <h1>Lista de clientes <button type="button" class="help-icon" data-help="clientes.titulo" aria-label="Ayuda"></button></h1>

          <div class="filter-row">
            <a th:href="@{/clientes}" class="btn"
              th:classappend="${estadoSeleccionado == null} ? ' btn-primary' : ' btn-outline'">
              Todos
            </a>
            <a th:href="@{/clientes(estado='Activo')}" class="btn"
              th:classappend="${estadoSeleccionado == 'Activo'} ? ' btn-primary' : ' btn-outline'">
              Activos
            </a>
            <a th:href="@{/clientes(estado='Suspendido')}" class="btn"
              th:classappend="${estadoSeleccionado == 'Suspendido'} ? ' btn-primary' : ' btn-outline'">
              Suspendidos
            </a>
            <a th:href="@{/clientes(estado='Nuevo')}" class="btn"
              th:classappend="${estadoSeleccionado == 'Nuevo'} ? ' btn-primary' : ' btn-outline'">
              Nuevos
            </a>
            <button type="button" class="help-icon" data-help="clientes.filtro" aria-label="Ayuda"></button>
          </div>

          <div style="display:flex; align-items:center; gap:16px;">
            <div class="search-bar">
              <label>Buscar: <button type="button" class="help-icon" data-help="clientes.buscar" aria-label="Ayuda"></button></label>
              <input type="text" id="searchInput" placeholder="Nombre, IP..." />
            </div>
            <a href="/clientes/nuevo" class="btn btn-primary">
              <span class="ph ph-user-plus" style="font-size:18px;"></span>
              Nuevo cliente
            </a>
            <button type="button" class="help-icon" data-help="clientes.nuevo" aria-label="Ayuda"></button>
          </div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Nombre</th>
                <th>IP</th>
                <th>Estado</th>
                <th>Plan</th>
                <th>Acciones <button type="button" class="help-icon" data-help="clientes.acciones" aria-label="Ayuda"></button></th>
              </tr>
            </thead>
            <tbody id="tableBody">
              <tr th:each="cliente : ${clientes}">
                <td th:text="${cliente.nombre}">Nombre</td>
                <td th:text="${cliente.ip}">192.168.10.1</td>
                <td>
                  <span class="badge"
                    th:classappend="${cliente.estado == 'Activo'} ? 'badge-active' : 'badge-suspend'"
                    th:text="${cliente.estado}">
                    Estado
                  </span>
                </td>
                <td th:text="${cliente.plan != null ? cliente.plan.nombre : 'Sin plan'}">50MB</td>
                <td class="actions">
                   <a th:onclick="'verDetalle(\'/clientes/ver/' + ${cliente.id} + '\')'" class="btn-icon btn-view" title="Ver" style="cursor:pointer;">
                    <span class="ph ph-eye"></span>
                  </a>
                  <a th:href="@{/clientes/editar/{id}(id=${cliente.id})}" class="btn-icon btn-edit" title="Editar">
                    <span class="ph ph-pencil-simple"></span>
                  </a>
                  <form th:action="@{/clientes/suspender/{id}(id=${cliente.id})}" method="post" style="display:inline;">
                      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn-icon btn-del" title="Suspender"
                      onclick="return confirm('¿Desea suspender este cliente?')">
                      <span class="ph ph-user-minus"></span>
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(clientes)}">
                <td colspan="5">
                  <div class="empty-state">
                    <span class="empty-icon ph ph-users"></span>
                    <h3>No hay clientes</h3>
                    <p>Comienza agregando tu primer cliente</p>
                  </div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>

    </div>

  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script th:src="@{/js/main.js}"></script>
  <script>
    initTableSearch('searchInput', 'tableBody');
  </script>

</body>
</html>
